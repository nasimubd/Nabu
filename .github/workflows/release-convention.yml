name: Release convention

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-convention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run release:check
      - run: mise run release:drift
